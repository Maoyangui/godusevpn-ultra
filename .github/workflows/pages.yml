name: Ultra GitHub Pages

on:
  push:
    branches: [codex/windows-privacy, main]
    paths:
      - "site/**"
      - "web/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ultra-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static site
        run: node site/build.mjs
      - name: Verify generated site
        run: |
          test -f site/dist/index.html
          test -f site/dist/ultra.css
          grep -q "GodUseVPN Ultra" site/dist/index.html
          grep -q "godusevpn.org/subscription" site/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
